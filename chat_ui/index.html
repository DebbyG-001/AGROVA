<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agrova Farm Assistant</title>
<style>
  :root {
    --bg: #f4f6ef; --surface: #ffffff; --ink: #1c2a1e; --muted: #5a685c; --line: #dce3d4;
    --brand: #2e7d32; --brand-ink: #ffffff; --bot: #eaf0e2; --user: #2e7d32; --user-ink: #ffffff;
    --warn: #b3261e; --chip: #e3ecd9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111611; --surface: #1a211a; --ink: #e8efe6; --muted: #9bab9c; --line: #2b362b;
      --brand: #66bb6a; --brand-ink: #0c170d; --bot: #232d22; --user: #2e7d32; --user-ink: #ffffff;
      --warn: #ff8a80; --chip: #26332a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .app { max-width: 760px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; background: var(--surface);
         border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  button { font: inherit; cursor: pointer; }
  .ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
  .ghost:hover { background: var(--chip); }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bot); border-bottom-left-radius: 4px; align-self: flex-start; }
  .user { background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; align-self: flex-end; }
  .err { background: transparent; color: var(--warn); border: 1px solid var(--warn); align-self: flex-start; }
  .meta { font-size: 12px; color: var(--muted); align-self: center; text-align: center; }
  .typing span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--muted);
                 animation: blink 1.2s infinite both; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
  .chip { background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 14px; }
  .chip:hover { border-color: var(--brand); }
  .chip.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
  form { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; max-height: 120px; font: inherit; color: var(--ink); background: var(--bg);
             border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  textarea:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .send { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 14px; padding: 0 18px; font-weight: 600; }
  .send:disabled { opacity: .5; cursor: default; }
  /* My farm panel */
  aside { position: fixed; inset: 0 0 0 auto; width: min(380px, 100%); background: var(--surface); border-left: 1px solid var(--line);
          transform: translateX(100%); transition: transform .2s; display: flex; flex-direction: column; z-index: 5; }
  aside.open { transform: none; box-shadow: -8px 0 24px rgba(0,0,0,.18); }
  aside header h2 { font-size: 16px; margin: 0; flex: 1; }
  .panel-body { overflow-y: auto; padding: 12px 16px 24px; }
  .panel-body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  .panel-body ul { list-style: none; margin: 0; padding: 0; }
  .panel-body li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .panel-body li small { display: block; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .row input { width: 70px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; } aside { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Agrova <small>Farm assistant for livestock and fish farmers</small></h1>
    <button class="ghost" id="farmBtn" type="button">My farm</button>
    <button class="ghost" id="newBtn" type="button">New chat</button>
  </header>
  <main id="log" aria-live="polite"></main>
  <div class="chips" id="quick"></div>
  <form id="form" autocomplete="off">
    <textarea id="input" rows="1" aria-label="Your message" placeholder="Type in English or Pidgin..."></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>

<aside id="panel" aria-label="My farm">
  <header>
    <h2>My farm</h2>
    <button class="ghost" id="refreshBtn" type="button">Refresh</button>
    <button class="ghost" id="closeBtn" type="button">Close</button>
  </header>
  <div class="panel-body">
    <label class="row">Farmer ID <input id="farmerId" type="number" min="1" value="1"></label>
    <h3>Animals</h3><ul id="animals"></ul>
    <h3>Latest records</h3><ul id="records"></ul>
  </div>
</aside>

<script>
(() => {
  // Same server when opened from http://.../ui/, otherwise talk to the default local server
  const API = location.protocol.startsWith("http") ? "" : "http://127.0.0.1:8000";
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), sendBtn = $("send"), quick = $("quick");
  const STARTERS = [
    "My goat dey cough, nose dey run",
    "My piglets dey pale and no dey grow",
    "Catfish dey gasp for morning",
    "My cow get lumps for skin",
    "I fed the broilers 40 kg today",
    "How many eggs have my layers laid?",
  ];
  let sessionId = newSession();
  let busy = false;

  function newSession() { return "web-" + Math.random().toString(36).slice(2, 10); }
  function farmerId() { return Math.max(1, parseInt($("farmerId").value, 10) || 1); }

  function bubble(text, cls) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;           // textContent: never interpret the reply as HTML
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function setChips(items) {
    quick.replaceChildren();
    items.forEach(({ label, send, primary }) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip" + (primary ? " primary" : ""); b.textContent = label;
      b.addEventListener("click", () => ask(send));
      quick.appendChild(b);
    });
  }

  function chipsForReply(reply) {
    // Confirmation prompt from record logging
    if (/\bYES\b/.test(reply) && /\bNO\b/.test(reply)) {
      return [{ label: "Yes, save it", send: "yes", primary: true }, { label: "No, cancel", send: "no" }];
    }
    // "Which one...? Reply with the number" prompt
    const opts = [...reply.matchAll(/^(\d+)\)\s*(.+)$/gm)];
    if (/number/i.test(reply) && opts.length) {
      return opts.map((m) => ({ label: `${m[1]}) ${m[2]}`, send: m[1] }));
    }
    return [];
  }

  async function ask(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    busy = true; sendBtn.disabled = true; quick.replaceChildren();
    bubble(text, "user");
    input.value = ""; autosize();
    const typing = bubble("", "bot typing");
    typing.innerHTML = "<span></span><span></span><span></span>";   // static markup only, no user data
    try {
      const res = await fetch(API + "/chat/", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, farmer_id: farmerId(), session_id: sessionId }),
      });
      const data = await res.json().catch(() => ({}));
      typing.remove();
      if (!res.ok) {
        const detail = Array.isArray(data.detail) ? data.detail.map((d) => d.msg).join("; ") : (data.detail || res.statusText);
        bubble("The server said: " + detail, "err");
      } else {
        bubble(data.reply, "bot");
        setChips(chipsForReply(data.reply));
        if (/^(Saved|I don save)/.test(data.reply)) loadPanel();
      }
    } catch (e) {
      typing.remove();
      bubble("I cannot reach the Agrova server" + (API ? " at " + API : "") + ". Is it running?", "err");
    } finally {
      busy = false; sendBtn.disabled = false; input.focus();
    }
  }

  function reset() {
    sessionId = newSession();
    log.replaceChildren();
    bubble("Hello! Ask me about your animals in English or Pidgin, or tell me what you did today, " +
           "like \"I fed the broilers 40 kg today\" and I will record it after you confirm.", "bot");
    setChips(STARTERS.map((s) => ({ label: s, send: s })));
  }

  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; }

  // ---- My farm panel
  function li(title, sub) {
    const el = document.createElement("li");
    el.textContent = title;
    if (sub) { const s = document.createElement("small"); s.textContent = sub; el.appendChild(s); }
    return el;
  }
  async function getJSON(path) { const r = await fetch(API + path); if (!r.ok) throw new Error(path); return r.json(); }

  async function loadPanel() {
    const animalsEl = $("animals"), recEl = $("records");
    try {
      const fid = farmerId();
      const [animals, health, feed, prod] = await Promise.all([
        getJSON(`/animals/?farmer_id=${fid}&limit=200`), getJSON("/health-events/?limit=500"),
        getJSON("/feed-records/?limit=500"), getJSON("/production-records/?limit=500"),
      ]);
      const names = new Map(animals.map((a) => [a.id, a.batch || `${a.species} #${a.id}`]));
      animalsEl.replaceChildren(...(animals.length
        ? animals.map((a) => li(a.batch || `${a.species} #${a.id}`, `${a.species}${a.breed ? ", " + a.breed : ""}`))
        : [li("No animals for this farmer yet.")]));
      const rows = [];
      health.forEach((r) => names.has(r.animal_id) && rows.push({ id: r.id, kind: "h", date: r.date, a: r.animal_id,
        text: "Health: " + (r.symptom || r.diagnosis || "note") }));
      feed.forEach((r) => names.has(r.animal_id) && rows.push({ id: r.id, kind: "f", date: r.date, a: r.animal_id,
        text: `Feed: ${r.quantity_kg ?? "?"} kg ${r.feed_type || ""}`.trim() }));
      prod.forEach((r) => names.has(r.animal_id) && rows.push({ id: r.id, kind: "p", date: r.date, a: r.animal_id,
        text: `${r.metric.replace(/_/g, " ")}: ${r.amount}` }));
      rows.sort((x, y) => (y.date.localeCompare(x.date)) || (y.id - x.id));
      recEl.replaceChildren(...(rows.length
        ? rows.slice(0, 12).map((r) => li(r.text, `${r.date} · ${names.get(r.a)}`))
        : [li("No records yet.")]));
    } catch (e) {
      animalsEl.replaceChildren(li("Could not load the farm records. Is the server running?"));
      recEl.replaceChildren();
    }
  }

  // ---- Wire up
  $("form").addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
  $("newBtn").addEventListener("click", reset);
  $("farmBtn").addEventListener("click", () => { $("panel").classList.add("open"); loadPanel(); });
  $("closeBtn").addEventListener("click", () => $("panel").classList.remove("open"));
  $("refreshBtn").addEventListener("click", loadPanel);
  $("farmerId").addEventListener("change", () => { loadPanel(); reset(); });
  reset();
})();
</script>
</body>
</html>
